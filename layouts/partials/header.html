<button type="button" id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">
  <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
  <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>
</button>

<script>
  (function () {
    var root = document.documentElement;
    var toggle = document.getElementById('theme-toggle');
    if (!toggle) return;

    function activeTheme() {
      var t = root.getAttribute('data-theme');
      if (t === 'light' || t === 'dark') return t;
      return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    function syncToggle() {
      var next = activeTheme() === 'dark' ? 'claro' : 'oscuro';
      toggle.setAttribute('aria-label', 'Cambiar a modo ' + next);
      toggle.title = 'Modo ' + next;
    }
    function setTheme(t) {
      root.setAttribute('data-theme', t);
      try { localStorage.setItem('rdcf-theme', t); } catch (e) {}
      syncToggle();
    }
    toggle.addEventListener('click', function () {
      setTheme(activeTheme() === 'dark' ? 'light' : 'dark');
    });
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
      if (!root.getAttribute('data-theme')) syncToggle();
    });
    syncToggle();
  })();
</script>
